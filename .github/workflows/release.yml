name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue pushes without interrupting an atomic publication or its API repair.
concurrency:
  group: release-main
  queue: max
  cancel-in-progress: false

jobs:
  release:
    name: Check exact candidate and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure release commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # The CLI checks the synchronized version commit, including the image,
      # before its atomic main/tag push. GITHUB_TOKEN pushes do not retrigger.
      - name: Publish or repair cumulative release
        run: pnpm exec tsx scripts/release/ReleaseCli.ts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_COMMIT: ${{ github.sha }}
