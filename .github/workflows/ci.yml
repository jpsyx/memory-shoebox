name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, build, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # GitHub Actions sets CI=true, which makes the postinstall hook skip the
      # coding-agent skill restore. No agent frontend runs here.
      - run: pnpm install --frozen-lockfile

      # Without a browser, every test that renders a message to a PDF calls
      # skip() and the run stays green. That is the one feature this repository
      # cannot check any other way, and a silent skip is how it would rot.
      - run: pnpm --filter @memory-shoebox/server exec playwright install --with-deps chromium

      - run: pnpm check

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Dockerfile is how every self-hoster deploys, so a break here is a
      # break for users even when the test suite is green.
      - run: |
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          digest="$(sha256sum "$fixture" | cut -d ' ' -f 1)"
          docker build --secret "id=web_env,src=$fixture" --build-arg "WEB_ENV_DIGEST=$digest" -t memory-shoebox:ci .
