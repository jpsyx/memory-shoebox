name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, build, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # GitHub Actions sets CI=true, which makes the postinstall hook skip the
      # coding-agent skill restore. No agent frontend runs here.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Dockerfile is how every self-hoster deploys, so a break here is a
      # break for users even when the test suite is green.
      - run: docker build -t famgram:ci .
